<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фотогалерея по датам</title>
    <style>
        /* Убираем отступы и прокрутку */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000; /* Черный фон для полос по бокам */
        }

        /* Картинка на весь экран без обрезки */
        #gallery-image {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Фото сжимается или увеличивается, чтобы влезть целиком */
            transition: opacity 1s ease-in-out; /* Плавный переход при смене */
            opacity: 1;
        }

        /* Класс для эффекта плавного исчезновения */
        .fade-out {
            opacity: 0 !important;
        }
    </style>
</head>
<body>

    <img id="gallery-image" src="" alt="Загрузка галереи...">

    <script>
        // --- НАСТРОЙКА ---
        const MAX_IMAGES_PER_DAY = 50; // Ищет до 50 картинок в папке (можно увеличить)
        const INTERVAL_TIME = 15000;  // Интервал смены картинок (15 секунд)
        
        // Запасная картинка из интернета, если папка на сегодня пуста или не найдена
        const DEFAULT_IMAGE = "https://picsum.photos"; 
        // ------------------

        let currentImages = [];
        let currentIndex = 0;
        const imgElement = document.getElementById('gallery-image');

        // 1. Функция для получения текущей даты в формате ДД-ММ-ГГГГ
        function getFormattedDate() {
            const today = new Date();
            const day = String(today.getDate()).padStart(2, '0');
            const month = String(today.getMonth() + 1).padStart(2, '0'); 
            const year = today.getFullYear();
            return `${day}-${month}-${year}`; // Пример имени папки: 29-08-2026
        }

        // 2. Функция проверки существования картинки на сервере
        function checkImageExists(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = url;
            });
        }

        // 3. Автоматический поиск картинок в сегодняшней папке
        async function loadImagesForToday() {
            const folderName = getFormattedDate(); 
            // Список расширений, которые скрипт проверит для каждого номера
            const extensions = ['jpg', 'JPG', 'jpeg', 'JPEG', 'png', 'PNG']; 
            
            for (let i = 1; i <= MAX_IMAGES_PER_DAY; i++) {
                let found = false;
                
                // Проверяем все расширения для текущего номера по очереди
                for (let ext of extensions) {
                    const imgUrl = `${folderName}/${i}.${ext}`;
                    const exists = await checkImageExists(imgUrl);
                    
                    if (exists) {
                        currentImages.push(imgUrl);
                        found = true;
                        break; // Нашли файл, переходим к следующему номеру (i+1)
                    }
                }
                
                // Если для номера 'i' не подошло ни одно расширение, значит картинки закончились
                if (!found) {
                    break;
                }
            }

            // Если картинок на сегодня нет вообще, используем запасную
            if (currentImages.length === 0) {
                currentImages.push(DEFAULT_IMAGE);
            }

            // Показываем первую картинку сразу
            imgElement.src = currentImages[0];

            // Если картинок больше одной, запускаем таймер смены
            if (currentImages.length > 1) {
                setInterval(changeImage, INTERVAL_TIME);
            }
        }

        // 4. Функция плавного переключения картинок
        function changeImage() {
            // Запускаем исчезновение (1 секунда)
            imgElement.classList.add('fade-out');

            // Через 1 секунду меняем адрес картинки и проявляем обратно
            setTimeout(() => {
                currentIndex = (currentIndex + 1) % currentImages.length;
                imgElement.src = currentImages[currentIndex];
                imgElement.classList.remove('fade-out');
            }, 1000);
        }

        // Запуск основного скрипта
        loadImagesForToday();
    </script>
</body>
</html>
