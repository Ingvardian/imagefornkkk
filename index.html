<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фотогалерея по датам</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        #gallery-image {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Измените на contain, если не хотите обрезать края */
            transition: opacity 1s ease-in-out;
            opacity: 1;
        }

        .fade-out {
            opacity: 0 !important;
        }
    </style>
</head>
<body>

    <img id="gallery-image" src="" alt="Загрузка галереи...">

    <script>
        // --- НАСТРОЙКА ---
        const MAX_IMAGES_PER_DAY = 20; // Максимальное количество фото, которое скрипт будет искать в папке
        const INTERVAL_TIME = 15000;  // Интервал смены картинок (15 секунд)
        const IMAGE_EXTENSION = 'jpg'; // Расширение ваших картинок (jpg, png или jpeg)
        
        // Запасная картинка, если папка на сегодня не найдена или пуста
        const DEFAULT_IMAGE = "https://picsum.photos"; 
        // ------------------

        let currentImages = [];
        let currentIndex = 0;
        const imgElement = document.getElementById('gallery-image');

        // 1. Функция для получения текущей даты в формате ДД-ММ-ГГГГ
        function getFormattedDate() {
            const today = new Date();
            const day = String(today.getDate()).padStart(2, '0');
            const month = String(today.getMonth() + 1).padStart(2, '0'); // Месяцы идут от 0 до 11
            const year = today.getFullYear();
            return `${day}-${month}-${year}`; // Пример: 29-08-2026
        }

        // 2. Функция проверки существования картинки на сервере
        function checkImageExists(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = url;
            });
        }

        // 3. Сканируем папку на наличие картинок от 1 до MAX_IMAGES_PER_DAY
        async function loadImagesForToday() {
            const folderName = getFormattedDate(); // Получаем имя папки (например, "29-08-2026")
            
            for (let i = 1; i <= MAX_IMAGES_PER_DAY; i++) {
                const imgUrl = `${folderName}/${i}.${IMAGE_EXTENSION}`;
                
                // Проверяем, есть ли файл 1.jpg, затем 2.jpg и т.д.
                const exists = await checkImageExists(imgUrl);
                if (exists) {
                    currentImages.push(imgUrl);
                } else {
                    // Если файл не найден, останавливаем поиск (считаем, что картинки закончились)
                    break;
                }
            }

            // Если картинок на сегодня нет, используем запасную
            if (currentImages.length === 0) {
                currentImages.push(DEFAULT_IMAGE);
            }

            // Запускаем показ первой картинки
            imgElement.src = currentImages[0];

            // Запускаем цикл смены, если картинок больше одной
            if (currentImages.length > 1) {
                setInterval(changeImage, INTERVAL_TIME);
            }
        }

        // 4. Функция плавной смены картинок
        function changeImage() {
            imgElement.classList.add('fade-out');

            setTimeout(() => {
                currentIndex = (currentIndex + 1) % currentImages.length;
                imgElement.src = currentImages[currentIndex];
                imgElement.classList.remove('fade-out');
            }, 1000);
        }

        // Запуск скрипта при загрузке страницы
        loadImagesForToday();
    </script>
</body>
</html>
